<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Beton Łagów — kierowca</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    :root{--navy:#12213d;--blue:#5577ee;--green:#16835f;--bg:#f4f6f9;--muted:#718096}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,sans-serif;color:#17233c}header{background:var(--navy);color:#fff;padding:18px 20px}.brand{font-size:21px;font-weight:800}.brand small{display:block;color:#99a9c1;font-size:10px;letter-spacing:1.4px}.wrap{max-width:720px;margin:22px auto;padding:0 14px}.card{background:#fff;border:1px solid #e5e9f0;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 28px #17233c0b}.hero{background:linear-gradient(135deg,#172b4d,#315f86);color:#fff}.btn{border:1px solid #d8dee8;background:#fff;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.full{width:100%;margin-top:10px}input,textarea{width:100%;padding:12px;border:1px solid #dce1eb;border-radius:12px;font:inherit;margin:5px 0 10px}label{font-size:11px;font-weight:700;color:var(--muted)}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#edf2ff;color:#4166d3;font-size:11px;font-weight:800}.muted{color:var(--muted);font-size:12px}.hidden{display:none}.items{padding:10px 0;border-top:1px solid #edf0f5;margin-top:12px}.actions{display:grid;gap:8px}.error{background:#fff1f2;color:#b9384c}@media(min-width:640px){.actions{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <header><div class="brand">Beton Łagów<small>PANEL KIEROWCY</small></div></header>
  <main class="wrap">
    <section id="login" class="card">
      <h2>Logowanie kierowcy</h2>
      <label>Login</label><input id="loginName" type="text" autocomplete="username" placeholder="np. Kicia">
      <label>Hasło</label><input id="password" type="password" autocomplete="current-password">
      <button class="btn primary full" onclick="signIn()">Zaloguj</button><div id="loginMsg" class="muted"></div>
    </section>
    <section id="app" class="hidden"><div class="card hero"><h2 style="margin:0 0 6px">Moje transporty</h2><div>Widzisz wyłącznie kursy przypisane do Twojego konta.</div><button class="btn" style="margin-top:14px" onclick="signOut()">Wyloguj</button></div><div id="list"></div></section>
  </main>
  <script>
    const SUPABASE_URL=window.BETON_CONFIG?.SUPABASE_URL||'';
    const SUPABASE_ANON_KEY=window.BETON_CONFIG?.SUPABASE_ANON_KEY||'';
    const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    let API=window.BETON_CONFIG?.API_URL||localStorage.betonApi||'http://127.0.0.1:5000';
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const names={assigned:'Przypisany',issued:'Towar wydany',in_transit:'W drodze',delivered:'Dostarczony',returned:'Powrót',closed:'Zamknięty',problem:'Problem'};
    const next={assigned:['issued','Potwierdź wydanie'],issued:['in_transit','Potwierdź wyjazd'],in_transit:['delivered','Potwierdź dostawę'],delivered:['returned','Potwierdź powrót']};
    function loginToAuthEmail(value){const v=String(value||'').trim().toLowerCase();if(v.includes('@'))return v;const safe=v.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9._-]/g,'');return safe?`${safe}@kierowca.betonlagow.local`:''}
    async function token(){const {data}=await sb.auth.getSession();return data.session?.access_token||''}
    async function signIn(){const authEmail=loginToAuthEmail(loginName.value);if(!authEmail){loginMsg.textContent='Podaj login.';return}loginMsg.textContent='Logowanie…';const {error}=await sb.auth.signInWithPassword({email:authEmail,password:password.value});if(error){loginMsg.textContent='Nieprawidłowy login lub hasło.';return}openApp()}
    async function signOut(){await sb.auth.signOut();location.reload()}
    async function openApp(){login.classList.add('hidden');app.classList.remove('hidden');load()}
    async function api(path,opt={}){const t=await token();const r=await fetch(API+path,{...opt,headers:{Authorization:`Bearer ${t}`,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||`Błąd ${r.status}`);return r}
    async function load(){list.innerHTML='<div class="card">Ładowanie…</div>';try{const j=await (await api('/api/driver/transports')).json();list.innerHTML=j.transports.length?j.transports.map(card).join(''):'<div class="card">Brak przypisanych transportów.</div>'}catch(e){list.innerHTML=`<div class="card error">${esc(e.message)}<br><span class="muted">Sprawdź adres API w config.js.</span></div>`}}
    function card(x){const n=next[x.status];const invoiceButton=x.invoice_id?`<button class="btn" onclick="invoice(${x.id})">Pobierz fakturę</button>`:'<span class="muted">Faktura pojawi się po rozliczeniu WZ</span>';return `<article class="card"><div><b>${esc(x.transport_no)}</b> <span class="badge">${esc(names[x.status]||x.status)}</span></div><h3>${esc(x.customer_name)}</h3><div class="muted">WZ: ${esc(x.wz_no||'—')} · ${esc(x.destination||'Brak adresu')} · ${esc(x.registration_no)}</div><div class="items">${(x.items||[]).map(i=>`<div><b>${esc(i.sku)}</b> — ${i.qty}</div>`).join('')}</div><div class="actions">${invoiceButton}${n?`<button class="btn primary" onclick="status(${x.id},'${n[0]}')">${n[1]}</button>`:''}</div>${x.status==='in_transit'||x.status==='delivered'?`<label style="display:block;margin-top:14px">Osoba odbierająca</label><input id="receiver-${x.id}" value="${esc(x.receiver_name||'')}"><label>Uwagi z dostawy</label><textarea id="notes-${x.id}">${esc(x.driver_notes||'')}</textarea><label>Zdjęcia dostawy / podpisanego WZ</label><input type="file" accept="image/*" capture="environment" multiple onchange="upload(${x.id},this.files)">`:''}</article>`}
    async function status(id,s){const receiver=document.getElementById('receiver-'+id)?.value||'',notes=document.getElementById('notes-'+id)?.value||'';try{await api(`/api/driver/transports/${id}/status`,{method:'POST',body:JSON.stringify({status:s,receiver_name:receiver,notes})});load()}catch(e){alert(e.message)}}
    async function invoice(id){const r=await api(`/api/driver/transports/${id}/invoice`);const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='faktura.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
    async function upload(id,files){const {data:{user}}=await sb.auth.getUser();for(const f of files){const path=`${user.id}/${id}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const {error}=await sb.storage.from('delivery-photos').upload(path,f);if(error){alert(error.message);return}const {error:e}=await sb.from('delivery_photos').insert({transport_id:id,storage_ref:path,created_by:user.id});if(e){alert(e.message);return}}alert('Zdjęcia zapisane.')}
    sb.auth.getSession().then(({data})=>data.session&&openApp());
  </script>
</body>
</html>
