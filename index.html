<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Beton Łagów — kierowca</title>
  <script src="driver-panel.js" defer></script>
  <style>
    :root{--navy:#12213d;--blue:#5577ee;--green:#16835f;--bg:#f4f6f9;--muted:#718096}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,sans-serif;color:#17233c}header{background:var(--navy);color:#fff;padding:14px 20px}.brand img{display:block;max-width:190px;max-height:62px;object-fit:contain;object-position:left center}.wrap{max-width:720px;margin:22px auto;padding:0 14px}.card{background:#fff;border:1px solid #e5e9f0;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 28px #17233c0b}.hero{background:linear-gradient(135deg,#172b4d,#315f86);color:#fff}.btn{border:1px solid #d8dee8;background:#fff;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.full{width:100%;margin-top:10px}input,textarea{width:100%;padding:12px;border:1px solid #dce1eb;border-radius:12px;font:inherit;margin:5px 0 10px}label{font-size:11px;font-weight:700;color:var(--muted)}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#edf2ff;color:#4166d3;font-size:11px;font-weight:800}.muted{color:var(--muted);font-size:12px}.hidden{display:none!important}.items{padding:10px 0;border-top:1px solid #edf0f5;margin-top:12px}.actions{display:grid;gap:8px}.error{background:#fff1f2;color:#b9384c}.delivery-row{cursor:pointer}.delivery-row:active{transform:scale(.99)}#detail{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:18px}#detail .detail-inner{max-width:720px;margin:auto}@media(min-width:640px){.actions{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <header><div class="brand"><img src="logo.png" alt="Beton Łagów"></div></header>
  <main class="wrap">
    <section id="login" class="card">
      <h2>Logowanie kierowcy</h2>
      <label>Login</label><input id="loginName" type="text" autocomplete="username" placeholder="np. Kicia">
      <label>Hasło</label><input id="password" type="password" autocomplete="current-password">
      <button id="loginButton" type="button" class="btn primary full">Zaloguj</button><div id="loginMsg" class="muted"></div>
    </section>
    <section id="app" class="hidden"><div class="card hero"><h2 style="margin:0 0 6px">Dzisiejsze dostawy</h2><div>Widzisz tylko niezakończone dostawy zaplanowane na dzisiaj.</div><button id="logoutButton" type="button" class="btn" style="margin-top:14px">Wyloguj</button></div><div id="list"></div></section>
    <section id="detail" class="hidden"><div class="detail-inner"><button class="btn" data-action="back">← Wróć do listy</button><div id="detailContent" style="margin-top:14px"></div></div></section>
  </main>
</body>
</html>
